<script>
(function(){
'use strict';
var MU=['Peito','Latíssimo','Upper Back','Ombro','Anterior de ombro','Posterior de ombro','Lateral de ombro','Tríceps','Bíceps','Quadríceps','Posterior','Panturrilha','Glúteo','Abs','Antebraço','Adutor'];
var SH=['Anterior de ombro','Posterior de ombro','Lateral de ombro'];
var WN=[['Semana 1','Base'],['Semana 2','Escada 1'],['Semana 3','Escada 2 · ápice'],['Remediação','Deload']];
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?n:0;};
var fmt=function(n){return n.toLocaleString('pt-BR',{maximumFractionDigits:1});};
var ml=function(m){return m==='Ombro'?'Ombro (geral)':m;};

/* CSS */
var st=document.createElement('style');
st.textContent=
'body.pv{background:#fff!important;color:#000!important;padding:0!important;color-scheme:light}'+
'body.pv .wrap{display:none!important}'+
'#pvView{max-width:900px;margin:0 auto;padding:16px;font:13px/1.4 Arial,Helvetica,sans-serif;color:#000;background:#fff}'+
'#pvView h1{font:700 22px Arial,sans-serif;margin:0 0 2px}'+
'#pvView .pmeta{color:#444;margin:0 0 8px}'+
'#pvView h2{font:700 16px Arial,sans-serif;margin:16px 0 4px;padding:7px 10px;background:#1e293b;color:#fff;border-radius:3px}'+
'#pvView h3{font:700 13px Arial,sans-serif;margin:14px 0 5px;padding-left:8px;border-left:4px solid #f59e0b}'+
'#pvView table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:6px}'+
'#pvView th,#pvView td{border:1px solid #cbd5e1;padding:5px 7px;text-align:left;vertical-align:top;word-wrap:break-word;font-size:12px}'+
'#pvView th{background:#e2e8f0;color:#0f172a;font-size:11px;text-transform:uppercase}'+
'#pvView tr{page-break-inside:avoid}'+
'#pvBar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;background:#1e293b;color:#f8fafc;font:13px Arial,sans-serif}'+
'#pvBar button{min-height:42px;padding:8px 14px;background:#f59e0b;color:#1c1304;border:0;border-radius:6px;font:600 14px Arial,sans-serif;cursor:pointer}'+
'@media print{#pvBar{display:none!important}#pvView section{page-break-after:always}#pvView section:last-child{page-break-after:auto}#pvView *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:12mm}}';
document.head.appendChild(st);

/* Volume semanal */
function vol(w){
  var d={},i={};MU.forEach(function(m){d[m]=0;i[m]=0;});
  (w.days||[]).forEach(function(day){var f=day.freq||1;(day.ex||[]).forEach(function(e){
    var n=(num(e.sets)+num(e.backoff)+num(e.extra))*f;
    if(d[e.muscle]!==undefined)d[e.muscle]+=n;
    if(e.sec2&&e.sec2!==e.muscle&&d[e.sec2]!==undefined)d[e.sec2]+=n;
    [e.sec,e.ind2].forEach(function(t){if(t&&t!==e.muscle&&i[t]!==undefined)i[t]+=n*0.5;});
  });});
  var out=[];
  MU.forEach(function(m){
    if(SH.indexOf(m)>=0)return;
    if(m==='Ombro'){
      var dd=d.Ombro,ii=i.Ombro;SH.forEach(function(x){dd+=d[x];ii+=i[x];});
      out.push(['Ombro (todos)',dd,ii,0]);
      SH.forEach(function(p){out.push([p,d[p],i[p],1]);});
      if(d.Ombro+i.Ombro>0)out.push(['Ombro (geral)',d.Ombro,i.Ombro,1]);
      return;
    }
    out.push([ml(m),d[m],i[m],0]);
  });
  return out.filter(function(r){return r[1]+r[2]>0;});
}
function det(e,d){
  var b=[],bo=num(e.backoff),ld=num(e.load),xs=num(e.extra);
  if(bo)b.push('+ '+bo+' backoff'+(ld?' · '+fmt(Math.round(ld*0.7*2)/2)+' kg':'')+' (−30%, 30 s)');
  if(xs)b.push('+ '+xs+' extra'+(e.tag?' ('+e.tag+')':''));else if(e.tag)b.push(e.tag);
  if(e.ss){var p=d.ex.filter(function(x){return x!==e&&x.ss===e.ss;}).map(function(x){return x.name||'Exercício';});b.push('Super set '+e.ss+(p.length?' com '+p.join(' + '):''));}
  return b.join(' · ');
}
function page(o,idx){
  var h='<h1>'+esc(o.name||'Minha ficha')+'</h1><p class="pmeta">Treino em Escada · gerado em '+new Date().toLocaleDateString('pt-BR')+'</p>';
  idx.forEach(function(k){
    var w=(o.weeks&&o.weeks[k])||{days:[]};
    h+='<section><h2>'+esc(WN[k][0])+' · '+esc(WN[k][1])+'</h2>';
    (w.days||[]).forEach(function(d){
      d.ex=d.ex||[];
      h+='<h3>'+esc(d.name||'Dia')+((d.freq||1)>1?' (×'+d.freq+' por semana)':'')+'</h3>';
      if(!d.ex.length){h+='<p>Sem exercícios.</p>';return;}
      h+='<table><colgroup><col style="width:27%"><col style="width:23%"><col style="width:16%"><col style="width:10%"><col style="width:24%"></colgroup><thead><tr><th>Exercício</th><th>Músculos</th><th>Séries × reps</th><th>Carga</th><th>Detalhes</th></tr></thead><tbody>';
      d.ex.forEach(function(e){
        var ind=[e.sec,e.ind2].filter(Boolean).map(ml).join(' + ');
        var mus=esc(ml(e.muscle));
        if(e.sec2)mus+='<br>Secundário: '+esc(ml(e.sec2));
        if(ind)mus+='<br>Indireto: '+esc(ind);
        h+='<tr><td>'+esc(e.name||'Exercício')+'</td><td>'+mus+'</td><td>'+esc(num(e.sets)+' × '+(e.reps||'–'))+'</td><td>'+(num(e.load)?esc(fmt(num(e.load)))+' kg':'–')+'</td><td>'+esc(det(e,d))+'</td></tr>';
      });
      h+='</tbody></table>';
    });
    var v=vol(w);
    if(v.length){
      h+='<h3>Volume semanal por músculo</h3><table><thead><tr><th>Músculo</th><th>Diretas</th><th>Indiretas</th><th>Total</th></tr></thead><tbody>';
      v.forEach(function(r){h+='<tr><td>'+(r[3]?'&nbsp;&nbsp;&nbsp;':'')+esc(r[0])+'</td><td>'+fmt(r[1])+'</td><td>'+fmt(r[2])+'</td><td><b>'+fmt(r[1]+r[2])+'</b></td></tr>';});
      h+='</tbody></table>';
    }
    h+='</section>';
  });
  return h;
}

/* Link (ficha compactada dentro da própria URL) */
function toB64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function fromB64(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function pack(idx){
  var o=JSON.parse(window.__app.payload());
  o.weeks=o.weeks.map(function(w,i){return idx.indexOf(i)>=0?w:{};});
  o.only=idx;
  var bytes=new TextEncoder().encode(JSON.stringify(o)),tag='r';
  if(window.CompressionStream){try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());tag='z';}catch(e){}}
  return location.href.split('#')[0]+'#pdf='+tag+toB64(bytes);
}
async function unpack(s){
  var bytes=fromB64(s.slice(1));
  if(s.charAt(0)==='z')bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* Modo leitura: quando o link tem #pdf=... */
if(/^#pdf=/.test(location.hash)){
  document.body.classList.add('pv');
  unpack(location.hash.slice(5)).then(function(o){
    var idx=(Array.isArray(o.only)?o.only:[0,1,2,3]).filter(function(i){return i>=0&&i<4;});
    var bar=document.createElement('div');bar.id='pvBar';
    bar.innerHTML='<button type="button" id="pvPrint">Salvar como PDF</button><span>Toque no botão e escolha “Salvar como PDF”.</span>';
    var v=document.createElement('div');v.id='pvView';v.innerHTML=page(o,idx.length?idx:[0,1,2,3]);
    document.body.insertBefore(v,document.body.firstChild);
    document.body.insertBefore(bar,document.body.firstChild);
    $('#pvPrint').addEventListener('click',function(){window.print();});
    document.title='Treino - '+(o.name||'ficha');
  }).catch(function(){
    document.body.classList.remove('pv');
    var m=$('#authMsg');if(m)m.textContent='Link inválido ou incompleto.';
  });
}

/* Botões e painel do link */
var tools=$('.tools .btns');
if(tools){
  var box=document.createElement('div');box.id='linkBox';box.hidden=true;
  box.style.cssText='display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px';
  tools.parentNode.insertBefore(box,tools.nextSibling);
  var show=function(idx){
    box.hidden=false;
    box.innerHTML='<div class="field"><label for="linkTa">Link da ficha (abre pronto para salvar em PDF)</label><textarea id="linkTa" rows="6" readonly spellcheck="false">Gerando…</textarea></div>'+
      '<div class="btns"><button type="button" class="btn primary" id="linkCopy">Copiar link</button><button type="button" class="btn" id="linkClose">Fechar</button></div><p class="hint" id="linkMsg" role="status"></p>';
    var ta=$('#linkTa'),msg=$('#linkMsg');
    $('#linkClose').onclick=function(){box.hidden=true;box.innerHTML='';};
    $('#linkCopy').onclick=function(){
      var fb=function(){ta.focus();ta.select();msg.textContent='Selecione e copie manualmente.';};
      try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent='Copiado.';}).catch(fb);}catch(e){fb();}
    };
    pack(idx).then(function(u){ta.value=u;ta.focus();ta.select();}).catch(function(){ta.value='';msg.textContent='Não foi possível gerar o link.';});
  };
  [['Link do PDF (semana)',function(){var a=document.querySelector('.wk[aria-selected="true"]');return [a?+a.dataset.week:0];}],
   ['Link do PDF (ficha toda)',function(){return [0,1,2,3];}]].forEach(function(x){
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent=x[0];
    b.addEventListener('click',function(){show(x[1]());});
    tools.appendChild(b);
  });
}
})();
  </script>
